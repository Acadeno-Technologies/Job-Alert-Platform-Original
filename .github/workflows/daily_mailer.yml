name: Daily Automated Job Alert Emailer (10 AM & 5 PM IST)

on:
  schedule:
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
    # 05:00 PM IST (17:00 IST) = 11:30 UTC
    - cron: '30 11 * * *'
  workflow_dispatch:

# Needed so the workflow can save the refreshed job files back to the repo
permissions:
  contents: write

jobs:
  send-job-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Refresh India jobs (Adzuna)
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: |
          python -u job_fetcher.py

      - name: Refresh UAE / Gulf jobs
        run: |
          python -u gulf_job_fetcher.py

      - name: Save refreshed job files back to the repo
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add jobs.json gulf_jobs.json
          if git diff --cached --quiet; then
            echo "No job changes to save."
          else
            git commit -m "Auto-refresh jobs.json and gulf_jobs.json"
            git push
          fi

      - name: Send Automated Job Alert Emails
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          STUDENT_NAMES: ${{ secrets.STUDENT_NAMES }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          python -u mailer.py