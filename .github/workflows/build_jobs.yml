name: Refresh jobs (fetch -> verify -> build)

on:
  push:
    paths:
      - 'my_jobs.csv'
      - 'careers.csv'
      - 'careers.py'
      - 'build_jobs.py'
      - 'fetch_jobs.py'
  schedule:
    - cron: '0 3 * * *'     # every day 08:30 IST, before the 10 AM mailer
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch live fresher openings from many companies
        run: python -u fetch_jobs.py

      - name: Remove broken / careers-page links from the CSVs
        run: python -u check_job_links.py --remove-dead

      - name: Build jobs.json
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: python -u build_jobs.py

      - name: Save results back to the repo
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add jobs.json gulf_jobs.json careers_auto.csv careers.csv
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-refresh jobs"
            git pull --rebase
            git push
          fi