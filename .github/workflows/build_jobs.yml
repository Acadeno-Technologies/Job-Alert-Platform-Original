name: Update jobs when my_jobs.csv changes

# Runs whenever you push a change to my_jobs.csv, so jobs.json (and the portal)
# update within a minute - without sending any emails.
on:
  push:
    paths:
      - 'my_jobs.csv'
      - 'careers.csv'
      - 'careers.py'
      - 'build_jobs.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build jobs.json from careers.csv + my_jobs.csv
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          python -u build_jobs.py

      - name: Save jobs.json back to the repo
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add jobs.json
          if git diff --cached --quiet; then
            echo "No changes to jobs.json."
          else
            git commit -m "Auto-update jobs.json from careers.csv / my_jobs.csv"
            git pull --rebase
            git push
          fi